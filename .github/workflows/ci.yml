name: CI

on:
  push:
    branches:
      - main
      - 001-live-image
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build elekstubev1 firmware
        run: pio run -e elekstubev1

      - name: Build elekstubev1 filesystem
        run: pio run -e elekstubev1 -t buildfs

      - name: Build elekstubev2 firmware
        run: pio run -e elekstubev2

      - name: Build elekstubev2 filesystem
        run: pio run -e elekstubev2 -t buildfs

      - name: Run tests if present
        shell: bash
        run: |
          if [ -d test ]; then
            pio test -e elekstubev1
            pio test -e elekstubev2
          else
            echo "No test directory; skipping PlatformIO tests."
          fi
