name: CI

on:
  push:
    branches:
      - main
      - 001-live-image
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build and test
        shell: bash
        run: |
          mkdir -p ci-logs
          status=0
          pio run -e elekstubev1 > ci-logs/elekstubev1-firmware.log 2>&1 || status=1
          pio run -e elekstubev1 -t buildfs > ci-logs/elekstubev1-buildfs.log 2>&1 || status=1
          pio run -e elekstubev2 > ci-logs/elekstubev2-firmware.log 2>&1 || status=1
          pio run -e elekstubev2 -t buildfs > ci-logs/elekstubev2-buildfs.log 2>&1 || status=1
          if find test -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.ino' \) | grep -q .; then
            pio test -e elekstubev1 > ci-logs/elekstubev1-test.log 2>&1 || status=1
            pio test -e elekstubev2 > ci-logs/elekstubev2-test.log 2>&1 || status=1
          else
            echo "No PlatformIO test suites; skipping tests." > ci-logs/tests.log
          fi
          for file in ci-logs/*.log; do
            echo "===== ${file} ====="
            tail -n 120 "${file}"
          done
          exit ${status}

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-logs
          if-no-files-found: ignore
